{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "lg-agent.fullname" . }}
  labels:
    app: {{ include "lg-agent.name" . }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                {{- if eq .component "api" }}
                name: {{ include "lg-agent.fullname" $ }}-api
                {{- else if eq .component "adminWeb" }}
                name: {{ include "lg-agent.fullname" $ }}-admin-web
                {{- else if eq .component "traineeWeb" }}
                name: {{ include "lg-agent.fullname" $ }}-trainee-web
                {{- else }}
                {{- fail (printf "unsupported ingress component %q" .component) }}
                {{- end }}
                port:
                  {{- if eq .component "api" }}
                  number: {{ $.Values.api.service.port }}
                  {{- else if eq .component "adminWeb" }}
                  number: {{ $.Values.adminWeb.service.port }}
                  {{- else }}
                  number: {{ $.Values.traineeWeb.service.port }}
                  {{- end }}
          {{- end }}
    {{- end }}
{{- end }}
