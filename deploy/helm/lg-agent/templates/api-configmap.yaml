apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "lg-agent.fullname" . }}-api-config
  labels:
    {{- include "lg-agent.componentLabels" (dict "root" . "component" "api") | nindent 4 }}
data:
  NODE_ENV: {{ .Values.global.env | quote }}
  PORT: {{ .Values.api.service.port | quote }}
  RELEASE_VERSION: {{ .Values.global.releaseVersion | quote }}
  LLM_PROVIDER: {{ .Values.api.env.LLM_PROVIDER | quote }}
  SANDBOX_EXECUTOR: {{ .Values.api.env.SANDBOX_EXECUTOR | quote }}
  SANDBOX_ENABLED_LANGUAGES: {{ .Values.api.env.SANDBOX_ENABLED_LANGUAGES | quote }}
