apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "lg-agent.fullname" . }}-api-config
  labels:
    app: {{ include "lg-agent.name" . }}-api
data:
  NODE_ENV: {{ .Values.global.env | quote }}
  PORT: {{ .Values.api.service.port | quote }}
  REDIS_URL: {{ .Values.api.env.REDIS_URL | quote }}
  MINIO_ENDPOINT: {{ .Values.api.env.MINIO_ENDPOINT | quote }}
  MINIO_PORT: {{ .Values.api.env.MINIO_PORT | quote }}
  MINIO_USE_SSL: {{ .Values.api.env.MINIO_USE_SSL | quote }}
