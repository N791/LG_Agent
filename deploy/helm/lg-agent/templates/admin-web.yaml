{{- if .Values.adminWeb.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lg-agent.fullname" . }}-admin-web
  labels:
    {{- include "lg-agent.componentLabels" (dict "root" . "component" "admin-web") | nindent 4 }}
spec:
  replicas: {{ .Values.adminWeb.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "lg-agent.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: admin-web
  template:
    metadata:
      labels:
        {{- include "lg-agent.componentLabels" (dict "root" . "component" "admin-web") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      {{- include "lg-agent.imagePullSecrets" . | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: admin-web
          image: "{{ required "adminWeb.image.repository is required" .Values.adminWeb.image.repository }}:{{ include "lg-agent.imageTag" (dict "root" . "image" .Values.adminWeb.image) }}"
          imagePullPolicy: {{ .Values.adminWeb.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: {{ .Values.adminWeb.probes.livenessPath }}
              port: http
          readinessProbe:
            httpGet:
              path: {{ .Values.adminWeb.probes.readinessPath }}
              port: http
          resources:
            {{- toYaml .Values.adminWeb.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "lg-agent.fullname" . }}-admin-web
  labels:
    {{- include "lg-agent.componentLabels" (dict "root" . "component" "admin-web") | nindent 4 }}
spec:
  type: {{ .Values.adminWeb.service.type }}
  selector:
    app.kubernetes.io/name: {{ include "lg-agent.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: admin-web
  ports:
    - name: http
      port: {{ .Values.adminWeb.service.port }}
      targetPort: http
{{- end }}
