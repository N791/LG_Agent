apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lg-agent.fullname" . }}-api
  labels:
    app: {{ include "lg-agent.name" . }}-api
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "lg-agent.name" . }}-api
  template:
    metadata:
      labels:
        app: {{ include "lg-agent.name" . }}-api
    spec:
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "lg-agent.fullname" . }}-api-config
            - secretRef:
                name: {{ include "lg-agent.fullname" . }}-api-secret
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
