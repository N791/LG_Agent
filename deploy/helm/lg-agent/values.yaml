global:
  env: "production"

api:
  replicaCount: 1
  image:
    repository: ghcr.io/lg-agent/api
    pullPolicy: IfNotPresent
    # Overrides the image tag whose default is the chart appVersion.
    tag: ""
  service:
    type: ClusterIP
    port: 3000
  resources:
    limits:
      cpu: 1000m
      memory: 1024Mi
    requests:
      cpu: 100m
      memory: 256Mi
  env:
    # Database connections
    DATABASE_URL: "postgresql://postgres:postgres@external-postgres:5432/lg_agent"
    REDIS_URL: "redis://external-redis:6379"
    # S3 / Minio
    MINIO_ENDPOINT: "external-minio"
    MINIO_PORT: "9000"
    MINIO_USE_SSL: "false"

web:
  replicaCount: 1
  image:
    repository: ghcr.io/lg-agent/web
    pullPolicy: IfNotPresent
    tag: ""
  service:
    type: ClusterIP
    port: 80
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 10m
      memory: 64Mi

ingress:
  enabled: true
  className: "nginx"
  annotations:
    # kubernetes.io/ingress.class: nginx
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"
  hosts:
    - host: lg-agent.local
      paths:
        - path: /api
          pathType: Prefix
          backend:
            serviceName: lg-agent-api
            servicePort: 3000
        - path: /
          pathType: Prefix
          backend:
            serviceName: lg-agent-web
            servicePort: 80
  tls: []
  #  - secretName: lg-agent-tls
  #    hosts:
  #      - lg-agent.local
