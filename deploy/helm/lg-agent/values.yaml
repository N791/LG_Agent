global:
  env: production
  releaseVersion: v1.0.0
  # Production releases must override every image tag with the same immutable
  # vX.Y.Z or sha-<40 hex> identifier.
  imageTag: v1.0.0
  imagePullSecrets: []

release:
  # Enabled only for the API phase. Later web-only phases set this to false so
  # migrations and registry reconciliation run exactly once per release.
  runMigration: true
  hookTimeoutSeconds: 600

secrets:
  # Provision this Secret before Helm (directly or with External Secrets).
  # Required keys are validated by the pre-rollout Job.
  existingSecret: lg-agent-api-runtime
  requiredKeys:
    databaseUrl: DATABASE_URL
    jwtSecret: JWT_SECRET
    redisUrl: REDIS_URL
    objectStorageEndpoint: MINIO_ENDPOINT
    objectStorageAccessKey: MINIO_ACCESS_KEY
    objectStorageSecretKey: MINIO_SECRET_KEY
    llmApiKey: OPENAI_API_KEY
    sandboxImagePullSecret: SANDBOX_IMAGE_PULL_SECRET

api:
  enabled: true
  replicaCount: 2
  image:
    repository: ghcr.io/lg-agent/lg-agent-api
    pullPolicy: IfNotPresent
    tag: ""
  service:
    type: ClusterIP
    port: 3000
  resources:
    limits:
      cpu: 1000m
      memory: 1024Mi
    requests:
      cpu: 100m
      memory: 256Mi
  env:
    LLM_PROVIDER: openai
    SANDBOX_EXECUTOR: docker
    SANDBOX_ENABLED_LANGUAGES: node
  probes:
    livenessPath: /api/v1/health
    readinessPath: /api/v1/health/ready

adminWeb:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/lg-agent/lg-agent-web
    pullPolicy: IfNotPresent
    tag: ""
  service:
    type: ClusterIP
    port: 80
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 10m
      memory: 64Mi
  probes:
    livenessPath: /healthz
    readinessPath: /readyz

traineeWeb:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/lg-agent/lg-agent-trainee-web
    pullPolicy: IfNotPresent
    tag: ""
  service:
    type: ClusterIP
    port: 80
  resources:
    limits:
      cpu: 750m
      memory: 512Mi
    requests:
      cpu: 25m
      memory: 96Mi
  probes:
    livenessPath: /healthz
    readinessPath: /readyz

ingress:
  enabled: true
  className: "nginx"
  annotations:
    # kubernetes.io/ingress.class: nginx
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"
  hosts:
    - host: lg-agent.local
      paths:
        - path: /api
          pathType: Prefix
          component: api
        - path: /
          pathType: Prefix
          component: adminWeb
    - host: learn.lg-agent.local
      paths:
        - path: /
          pathType: Prefix
          component: traineeWeb
  tls: []
