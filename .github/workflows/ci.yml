name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma Generate & Validate
        env:
          DATABASE_URL: 'postgresql://dummy:dummy@localhost:5432/dummy'
        run: |
          pnpm --filter @lg-agent/api exec prisma generate
          pnpm --filter @lg-agent/api exec prisma validate

      - name: ESLint
        run: pnpm run lint

      - name: Type Check
        run: pnpm run typecheck

      - name: Turbo Build
        run: npx turbo run build

      - name: Unit & Integration Tests
        run: npx turbo run test

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps
        working-directory: packages/e2e
        continue-on-error: true # Might fail if e2e is not fully set up yet

      - name: Playwright Smoke Test
        run: pnpm run test:smoke
        working-directory: packages/e2e
        continue-on-error: true # Might fail if e2e is not fully set up yet
