server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Support for React Router (Single Page Application)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to backend if needed (optional if using external API URL)
    # location /api/ {
    #     proxy_pass http://lg_agent_api:3000/;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    # }

    # Disable caching for index.html to ensure clients always get the latest version
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}
